<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다섯 가지 마노의 기록</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* 결과 페이지: 가운데 실제 마노 사진. 글은 지층처럼 한 줄씩 써지고, 단계마다 옆으로 밀림.
   사진 위에 올라간 글은 흰색(같은 글을 흰색으로 한 겹 더 깔고 사진 영역만 보이게 자름). */
:root {
  --page: #ffffff;
  --ink: #111111;
  --mute: #8a8a8a;
  --f: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-en: "Aleo", Georgia, "Times New Roman", serif;
  --fs-name: clamp(26px, 2.6vw, 40px);
  --fs-body: clamp(14px, 1.09vw, 16px);
  --fs-info: clamp(12px, .9vw, 14px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f); overflow: hidden; -webkit-font-smoothing: antialiased; }
.en { font-family: var(--f-en); letter-spacing: 0; }

.app { position: fixed; inset: 0; overflow: hidden; }
.photo { position: absolute; left: 0; top: 0; z-index: 2; background: #000; overflow: hidden; opacity: 0; }   /* 들어오자마자 사진 · 제목이 함께 보임 */
.photo.on { opacity: 1; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* 답과 이어진 특징만 밝게 남고 나머지는 어두워짐(스포트라이트), 그 자리에 관람객의 답이 써짐 */
.spot { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.6s ease; }
.spot.on { opacity: 1; }
.tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
  font-size: clamp(14px, 1.2vw, 19px); font-weight: 600; letter-spacing: -.01em; color: #fff;
  text-shadow: 0 0 8px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.4);
  clip-path: inset(-30% 100% -30% 0); opacity: 1; transition: clip-path .9s cubic-bezier(.3,.6,.2,1), opacity .5s ease; }
.tag.on { clip-path: inset(-30% -8% -30% -2%); }
.tag.off { opacity: 0; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.layer.ink { z-index: 1; color: var(--ink); }
.layer.white { z-index: 3; color: #ffffff; text-shadow: 0 0 6px rgba(0,0,0,.35), 0 0 1px rgba(0,0,0,.25); }   /* 밝은 결 위에서도 읽히게 살짝 그림자 */

/* 글 덩어리와 줄 */
.blk { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .45s ease; }
.blk.gone { opacity: 0; }
.part { transform-origin: 0 50%; }
.ln { white-space: nowrap; clip-path: inset(-30% 100% -30% 0); transition: clip-path var(--d, .6s) cubic-bezier(.3,.6,.2,1); }
.ln.on { clip-path: inset(-30% -8% -30% -2%); }
.name .ln { font-size: var(--fs-name); line-height: 1.3; font-weight: 500; letter-spacing: -.01em; text-align: center; clip-path: none; }
.blk.name { opacity: 0; transition: none; }
.blk.name.show { opacity: 1; }   /* 이름은 써지지 않고 서서히 나타남 */
.name .ln .en, .name .ln.en { font-weight: 400; }
.interp .ln { font-size: var(--fs-body); line-height: 2.05; letter-spacing: -.01em; font-weight: 500; }   /* 해석: 한 단계 굵게 */
.interp .part { position: absolute; left: 0; top: 0; transition: transform .5s cubic-bezier(.3,.6,.2,1), opacity .5s ease; }
.info .ln { font-size: var(--fs-info); line-height: 1.8; letter-spacing: -.01em; font-weight: 500; }   /* 정보: Pretendard Medium */
/* 정보: 오른쪽 칸 안에서 스크롤 */
.info-scroll { position: absolute; z-index: 4; display: flex; flex-direction: column; justify-content: center; overflow: hidden;
  opacity: 0; pointer-events: none; transition: opacity .4s ease; }   /* 스크롤 없이 한 화면 */
.info-scroll.on { opacity: 1; pointer-events: auto; }
.ib { transform: translateY(36px); opacity: 0; transition: transform .8s cubic-bezier(.2,.7,.2,1), opacity .6s ease; }
.info-scroll .ln { clip-path: none; }   /* 정보는 써지지 않고 아래에서 위로만 */
.ib.in { transform: none; opacity: 1; }
.info .h { font-weight: 500; }
.info .sh { font-weight: 600; }
.meas { position: absolute; left: -99999px; top: 0; visibility: hidden; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; }
.meas .w { display: inline; }

/* QR · 버튼 */
.qr { position: absolute; z-index: 4; display: flex; align-items: center; gap: 12px; opacity: 0; pointer-events: none;
  transition: opacity .6s ease, left .9s cubic-bezier(.65,0,.25,1), top .9s cubic-bezier(.65,0,.25,1); }
.qr.col { flex-direction: column; text-align: center; }
.qr.on { opacity: 1; pointer-events: auto; }
.qr .code { width: var(--qs, 96px); height: var(--qs, 96px); background: #fff; transition: width .9s cubic-bezier(.65,0,.25,1), height .9s cubic-bezier(.65,0,.25,1); }
.qr .code img, .qr .code canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
.qr p { margin: 0; font-size: clamp(11px, .8vw, 13px); line-height: 1.6; color: var(--ink); }
.actions { position: absolute; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0; pointer-events: none;
  transition: opacity .6s ease, left .9s cubic-bezier(.65,0,.25,1), top .9s cubic-bezier(.65,0,.25,1); }
.actions.on { opacity: 1; pointer-events: auto; }
/* 버튼 3개: 지층 글처럼 한 칸씩 들여쓰고 줄마다 조금씩 다른 기울기. 마우스를 올리면 펴짐 */
.actions > * { transform-origin: 50% 50%; transform: rotate(var(--r, 0deg)); }   /* 가운데 정렬 + 줄마다 다른 기울기(지층), 보이는 버튼 순서대로 (layout) */
.actions > *:hover, .actions > *:focus-visible { transform: none; }
.actions button, .actions a { font: 500 15px/1 var(--f); color: #333; background: none; border: 0; padding: 8px 6px; cursor: pointer; text-decoration: none;
  transition: color .25s ease, font-weight .3s ease, transform .3s ease; }
.actions button:hover, .actions a:hover, .actions button:focus-visible, .actions a:focus-visible { color: var(--ink); font-weight: 900; -webkit-text-stroke: .7px currentColor; outline: none; }

/* 다음으로 안내 + 읽는 시간 막대 */
.next { position: absolute; z-index: 5; left: 84%; top: 83%; transform: translateX(-50%);   /* 해석 문단 아래, 나중에 버튼이 나오는 자리 */
  border: 0; background: none; padding: 8px 12px; cursor: pointer; font: 500 13px/1 var(--f); color: #555; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
.next.on { opacity: 1; pointer-events: auto; }
.next .bar { display: block; width: 96px; height: 1px; margin: 8px auto 0; background: #dddddd; position: relative; overflow: hidden; }
.next .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); }
.next:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.roll { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; display: none; transition: opacity .4s ease; }
.credit { margin-top: 8px; font-size: 10px; line-height: 1.5; font-weight: 500; letter-spacing: -.01em; }   /* 사진 출처: '전해지는 이야기' 바로 아래 */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .ln, .photo, .qr, .actions, .blk, .next, .qr .code, .ib, .info-scroll, .spot, .tag { transition: none !important; }
}
</style>
</head>
<body>


<div class="app" id="app">
  <div class="layer ink" id="ink"></div>
  <div class="photo" id="photo"><img id="photoImg" alt=""><div class="spot" id="spot"></div><div class="tag" id="tag" aria-hidden="true"></div></div>
  <div class="layer white" id="white" aria-hidden="true"></div>
  <div class="info-scroll info" id="infoScroll" tabindex="0" aria-label="마노 정보"></div>
  <div class="qr" id="qr"><div class="code" id="qrCode"></div><p>지금 바로 손끝으로<br>마노의 무늬를 느껴보세요!</p></div>
  <div class="actions" id="actions">
    <button type="button" id="infoBtn">마노 정보 보기</button>
    <a href="index.html" id="againLink">다른 마노 살펴보기</a>
    <a href="agate-info.html" id="aboutLink">마노에 대하여</a>
  </div>
  <button class="next" type="button" id="next">스크롤해 다음 내용을 확인하세요.<span class="bar"><i id="bar"></i></span></button>
  <canvas class="roll" id="roll" aria-hidden="true"></canvas>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

      camera.left = -innerWidth / 2; camera.right = innerWidth / 2; camera.top = innerHeight / 2; camera.bottom = -innerHeight / 2; camera.updateProjectionMatrix();
    }
    // 멈출 자리: QR 바로 위 (QR과 같은 가로 중심)
    function restAt(W, H, R) {
      const qr = $('qr'), qh = qr.offsetHeight || H * .2;
      return [W * .84, H * .5 - qh / 2 - R * .95 - 18];
    }
    const outCubic = t => 1 - Math.pow(1 - t, 3);
    function bounce(t) {                         // 떨어져서 두 번 작게 튀고 멈춤
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
      return n * (t -= 2.625 / d) * t + .984375;
    }
    function draw(t) {
      const W = innerWidth, H = innerHeight, R = Math.max(26, Math.min(W, H) * 0.048);
      const [x1, y1] = restAt(W, H, R), x0 = W * .6, y0 = -R * 2;   // 위에서 → 오른쪽 QR 위로
      const ex = outCubic(t), ey = bounce(t);
      const x = x0 + (x1 - x0) * ex, y = y0 + (y1 - y0) * ey;
      const roll = (x - x0) / (R * 1.2) * -1 + 0.6;                 // 오른쪽으로 굴러간 거리만큼 회전
      const w = 1 - t;                                              // 흔들림은 멈추면서 사라짐
      mesh.visible = shadow.visible = true;
      mesh.scale.setScalar(R);
      mesh.position.set(x - W / 2, -(y - H / 2), 0);
      mesh.rotation.set(Math.sin(roll * .5) * .35 * w, Math.cos(roll * .4) * .25 * w, roll);
      const lift = Math.max(0, (y1 - y) / R);                        // 떠 있을수록 그림자는 작고 옅게
      shadow.position.set(x - W / 2, -(y1 + R * .7 - H / 2), -900);
      shadow.scale.set(R * 2.6 / (1 + lift * .3), R * .7 / (1 + lift * .3), 1);
      shadow.material.opacity = Math.max(0, 1 - lift * .25) * Math.min(1, t * 4);
      renderer.render(scene, camera);
    }
    function tick(now) {
      if (!mesh) { requestAnimationFrame(tick); return; }
      if (t0 < 0) t0 = now;
      const t = Math.min(1, (now - t0) / ROLL.MS);
      draw(t);
      if (t < 1) requestAnimationFrame(tick); else settled = true;
    }
    addEventListener('resize', () => { if (!started) return; size(); if (settled) draw(1); });
    return {
      go() { if (started) return; started = true; size(); cv.style.display = 'block'; cv.style.opacity = 1; setTimeout(() => requestAnimationFrame(tick), ROLL.DELAY); },
      show(on) { if (started) cv.style.opacity = on ? 1 : 0; }      // 정보를 볼 때는 잠시 숨김
    };
  })();

  // ── QR ─────────────────────────────────────────────────
  try {
    if (window.QRCode) new QRCode($('qrCode'), { text: (QR_URL || location.href.split('#')[0].replace(/[^/]*$/, 'mobile.html')) + '#' + id + '&a=' + encodeURIComponent([...answer].slice(0, 20).join('')), width: 256, height: 256, colorDark: '#111111', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    else $('qr').querySelector('.code').style.display = 'none';
  } catch (_) {}

  // ── 시작 ───────────────────────────────────────────────
  let rt = 0;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      VW = innerWidth; VH = innerHeight;
      const nw = nameB && nameB.written, iw = interpB && interpB.written;
      buildText(); nameB.written = nw; interpB.written = iw;
      if (nw) nameB.lines.forEach(L => L.on()); if (iw) interpB.lines.forEach(L => L.on());
      if (nw) nameB.els.forEach(e => e.classList.add('show'));
      if (stage === 3) { const st = $('infoScroll').scrollTop; buildInfo(); infoBs.forEach(b => { b.el.classList.add('in'); b.lines.forEach(L => L.on()); }); $('infoScroll').scrollTop = st; }
      layout();
    }, 150);
  });
  let started = false, imgOk = false;
  function imgReady() { imgOk = true; if (started && stage < 0) begin(); }
  function begin() { if (ABOUT) goAbout(); else go(0); }
  function goAbout() {                        // 해석 없이 바로: 왼쪽 이름 · 가운데 사진 · 오른쪽 정보 · "다른 마노 보기"
    stage = 3; app.dataset.stage = 3;
    setGone(interpB, true);
    layout(); nameB.lines.forEach(L => L.on()); nameB.written = true;
    nameB.els.forEach(e => e.classList.add('show')); photo.classList.add('on');
    buildInfo(); $('infoScroll').classList.add('on');
    infoBs.slice().reverse().forEach((b, k) => setTimeout(() => b.el.classList.add('in'), reduced ? 0 : 200 + k * 110));
    infoBs.forEach(b => b.lines.forEach(L => L.on()));
    $('qr').style.display = 'none'; $('infoBtn').style.display = 'none'; $('aboutLink').style.display = 'none';   // 상세 화면은 이미 '마노에 대하여'에서 왔으므로
    const a = $('againLink'); a.textContent = '다른 마노 살펴보기'; a.href = 'agate-info.html#' + id;
    const h = document.createElement('a'); h.href = 'index.html'; h.textContent = '처음으로 가기'; $('actions').appendChild(h);   // 상세 화면: 다른 마노 보기 아래에 처음으로
    $('actions').classList.add('on'); layout();
    live.textContent = D.ko + ' ' + D.en + '. ' + [LABEL[id].name + '는 ' + LABEL[id].intro].concat(...LABEL_HEADS.filter(h => LABEL[id][h[2]]).map(([ko, en, key]) => [ko, LABEL[id][key]])).join(' ');
  }
  function start() {
    buildText(); layout();
    started = true; if (imgOk) begin(); else setTimeout(() => { if (stage < 0) begin(); }, 1500);   // 사진이 준비되면 사진 · 제목을 동시에
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(start); else start();
  window.AgateResult = { go: n => go(n), state: () => ({ stage, id, answer: Q }) };
})();
</script>

</body>
