<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마노에 대하여</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* 마노에 대하여 (흰 화면 · 익숙한 레이아웃): 가운데 검은 판 안에서 마노 5장이 lighten으로 겹쳐 있다가
   한 겹씩 사라지고 다시 한 겹씩 쌓이기를 반복. 왼쪽 아래 작은 표본을 누르면 그 마노의 설명 화면으로 */
:root {
  --page: #ffffff; --ink: #111111;
  --f: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f); overflow: hidden; -webkit-font-smoothing: antialiased; }

.panel { position: fixed; background: #000; overflow: hidden; isolation: isolate; z-index: 5;
  transition: left .5s cubic-bezier(.65,0,.25,1), top .5s cubic-bezier(.65,0,.25,1), width .5s cubic-bezier(.65,0,.25,1), height .5s cubic-bezier(.65,0,.25,1); }
.thumbs { opacity: 0; transition: opacity .6s ease; }
.thumbs.on { opacity: 1; }
.panel img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: none; display: block; mix-blend-mode: lighten;
  transition: opacity var(--d, .7s) ease, width .5s cubic-bezier(.65,0,.25,1), height .5s cubic-bezier(.65,0,.25,1);
  opacity: 1; }   /* 다 줄어든 뒤 판 = 사진 크기, 비율 그대로 */
.panel img.gone { opacity: 0; }   /* 한 겹씩 통째로 사라짐 */
/* 글: 단락마다 왼쪽에서 오른쪽으로 써지듯 나타남 (결과 화면과 같은 방식) */
.txt { clip-path: inset(-30% 100% -30% 0); transition: clip-path .9s cubic-bezier(.3,.6,.2,1); }
.txt.on { clip-path: inset(-30% -4% -30% -4%); }
.home { position: fixed; font: 500 15px/1 var(--f); color: #333; text-decoration: none; padding: 8px 6px; opacity: 0; transition: opacity .6s ease, color .25s ease, font-weight .3s ease; }
.home.on { opacity: 1; }
.home:hover, .home:focus-visible { color: var(--ink); font-weight: 900; -webkit-text-stroke: .7px currentColor; outline: none; }

.thumbs { position: fixed; display: flex; gap: 6px; }
.thumbs button { flex: none; background: #000; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; overflow: hidden;
  transition: transform .25s ease; }
.thumbs button img { width: 86%; height: 86%; object-fit: contain; display: block; pointer-events: none; }
.thumbs button:hover, .thumbs button:focus-visible { transform: translateY(-4px); outline: none; }
.thumbs button:focus-visible { box-shadow: 0 0 0 2px var(--ink); }

.txt { position: fixed; margin: 0; color: var(--ink); letter-spacing: -.01em; }
.ttl { font-size: clamp(14px, calc(.9vw + 2px), 16px); font-weight: 600; line-height: 1.8; }   /* 상세 화면 정보 글과 같은 타입 */
.para { font-size: clamp(12px, .9vw, 14px); font-weight: 500; line-height: 1.8; transform-origin: 0 50%; word-break: keep-all; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .panel img, .txt, .home { transition: none; } }
</style>
</head>
<body>


<div class="panel" id="panel" aria-label="마노 다섯 개가 겹겹이 쌓였다 걷히는 이미지"></div>
<div class="thumbs" id="thumbs" aria-label="마노 표본"></div>
<h1 class="txt ttl" id="ttl">마노는 어떤 광물일까?</h1>
<p class="txt para" id="p1">마노는 석영과 같은 성분을 가진 칼세도니의 한 종류입니다. 주로 암석의 빈 공간이나 틈에 실리카가 오랜 시간 쌓이면서 만들어집니다.</p>
<a class="home" id="home" href="index.html">처음으로 가기</a>
<p class="txt para" id="p2">이 과정에서 광물층이 여러 겹으로 형성되고, 층마다 색과 형태가 달라지면서 독특한 띠무늬가 나타납니다. 어떤 마노는 잔잔한 물결처럼, 또 어떤 마노는 이끼나 레이스처럼 보이기도 합니다.</p>

<script>

(function () {
  'use strict';
  // ── 설정 ─────────────────────────────────────────────
  const IDS = ['blue-lace', 'black-banded', 'crazy-lace', 'fire', 'moss'];   // 아래 표본 순서
  const NAMES = { 'blue-lace': '블루 레이스 마노', 'black-banded': '블랙 밴디드 마노', 'crazy-lace': '크레이지 레이스 마노', 'fire': '파이어 마노', 'moss': '모스 마노' };
  const SRC = id => 'agate/real/' + id + '.webp';
  const DETAIL = id => 'result.html#' + id + '&about';
  // 반복: 다 쌓인 채 HOLD → 한 겹씩 STEP 간격으로 걷힘(마지막 한 장 남음) → BOTTOM 동안 머묾 → 한 겹씩 다시 쌓임
  const HOLD = 1600, STEP = 520, BOTTOM = 1400, DUR = .75;
  // 자리 (화면 비율, 시안 기준)
  const PANEL = { cx: .5, y: .068, h: .87 };       // 가운데 판: 가로 중심 · 위 · 높이 (너비는 사진 비율대로)
  const INTRO = { hold: 1500, h: 1.0 };              // 처음: 화면 전체가 검고 사진이 화면 높이만큼 크게 → hold 뒤 판이 줄어듦
  const THUMB = { cx: .842, cy: .507, w: .037, h: .087 };   // 오른쪽 작은 표본 (가운데 기준)
  const TEXT = { ttl: [.026, .365], p1: [.022, .46, -2.2], p2: [.02, .55, -2.6], w: .282, home: [.842, .855] };   // 왼쪽 글 · 버튼은 오른쪽 아래(표본 아래)

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const fallback = window.INFO_ASSETS || {};
  const panel = $('panel'), thumbs = $('thumbs');

  function load(id) {
    return new Promise(res => {
      const im = new Image(); im.alt = '';
      im.onload = () => res(im);
      im.onerror = () => { if (fallback[id] && im.src !== fallback[id]) im.src = fallback[id]; else res(null); };
      im.src = SRC(id);
    });
  }

  let layers = [], opened = false;
  function layout() {
    const VW = innerWidth, VH = innerHeight;
    const ar = layers[0] ? layers[0].ar : .75, ph = VH * PANEL.h, pw = ph * ar;
    if (opened) Object.assign(panel.style, { left: (VW * PANEL.cx - pw / 2) + 'px', top: VH * PANEL.y + 'px', width: pw + 'px', height: ph + 'px' });
    else Object.assign(panel.style, { left: '0px', top: '0px', width: VW + 'px', height: VH + 'px' });
    const ih = opened ? ph : VH * INTRO.h;
    layers.forEach(L => { L.el.style.height = ih + 'px'; L.el.style.width = ih * L.ar + 'px'; });
    const tw = VW * THUMB.w, th = VH * THUMB.h;
    Object.assign(thumbs.style, { left: (VW * THUMB.cx - (tw * 5 + 24) / 2) + 'px', top: (VH * THUMB.cy - th / 2) + 'px' });
    thumbs.querySelectorAll('button').forEach(b => { b.style.width = tw + 'px'; b.style.height = th + 'px'; });
    const W = VW * TEXT.w;
    Object.assign($('ttl').style, { left: TEXT.ttl[0] * VW + 'px', top: TEXT.ttl[1] * VH + 'px' });
    const hm = $('home'); Object.assign(hm.style, { left: (TEXT.home[0] * VW - hm.offsetWidth / 2) + 'px', top: TEXT.home[1] * VH + 'px' });
    [['p1', TEXT.p1], ['p2', TEXT.p2]].forEach(([id, p]) => Object.assign($(id).style, { left: p[0] * VW + 'px', top: p[1] * VH + 'px', width: W + 'px', transform: 'rotate(' + p[2] + 'deg)' }));
  }

  Promise.all(IDS.map(load)).then(imgs => {
    // 아래 작은 표본
    IDS.forEach((id, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', NAMES[id] + ' 자세히 보기'); b.title = NAMES[id];
      const im = document.createElement('img'); im.alt = ''; im.src = imgs[k] ? imgs[k].src : '';
      b.appendChild(im); b.addEventListener('click', () => { location.href = DETAIL(id); });
      thumbs.appendChild(b);
    });
    // 가운데 판의 층
    imgs.forEach((im, k) => { if (!im) return; im.style.setProperty('--d', DUR + 's'); panel.appendChild(im); layers.push({ id: IDS[k], el: im, ar: im.naturalWidth / im.naturalHeight }); });
    layout();
    addEventListener('resize', layout);
    // 글: 제목 → 첫 단락 → 둘째 단락 순으로 나타나고, 마지막에 '처음으로 가기'
    // 처음: 검은 화면 가득 겹친 마노 → 판이 줄어들며 흰 화면이 드러남 → 표본 · 글 · 버튼
    const T0 = reduced ? 0 : INTRO.hold, T1 = reduced ? 0 : T0 + 500;   // 줄어드는 시간 0.5초
    setTimeout(() => { opened = true; layout(); }, T0);
    setTimeout(() => thumbs.classList.add('on'), T1);
    ['ttl', 'p1', 'p2'].forEach((id, k) => setTimeout(() => $(id).classList.add('on'), reduced ? 0 : T1 + 200 + k * 750));
    setTimeout(() => $('home').classList.add('on'), reduced ? 0 : T1 + 200 + 3 * 750);
    if (reduced || layers.length < 2) return;

    // 한 겹씩 걷히고 다시 쌓이기를 반복. 매번 남는 마노가 바뀌도록 순서를 한 칸씩 돌림
    let cycle = 0;
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async function loop() {
      for (;;) {
        await wait(HOLD);
        const n = layers.length, keep = cycle % n;
        const order = []; for (let k = n - 1; k >= 0; k--) if (k !== keep) order.push(k);   // 위에 놓인 층부터
        for (const k of order) { layers[k].el.classList.add('gone'); await wait(STEP); }
        await wait(BOTTOM);
        for (const k of order.slice().reverse()) { layers[k].el.classList.remove('gone'); await wait(STEP); }
        cycle++;
      }
    })();
  });
})();
</script>

</body>
</html>
