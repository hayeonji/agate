<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>마노의 결 쓰다듬기</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* 휴대폰: 차례를 기다렸다가, 내 차례가 오면 검은 판 위의 마노를 쓰다듬음 → 손끝 위치가 웹소켓으로 큰 스크린(터치디자이너)에 전달됨 */
:root {
  --f: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #000; color: #fff; font-family: var(--f); overflow: hidden; -webkit-font-smoothing: antialiased;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
.app { position: fixed; inset: 0; height: 100dvh; }

/* 안내 문장: 기울어진 두 줄, 한 줄씩 써짐 */
.guide { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) rotate(-11deg); margin: 0; width: max-content; max-width: 94vw;
  font-size: clamp(16px, 4.8vw, 20px); font-weight: 700; line-height: 1.55; letter-spacing: -.02em; text-align: left; pointer-events: none; }
.guide .ln { display: block; white-space: nowrap; clip-path: inset(-30% 100% -30% 0); transition: clip-path .7s cubic-bezier(.3,.6,.2,1); }
.guide .ln:nth-child(2) { padding-left: .5em; }
.guide .ln.on { clip-path: inset(-30% -6% -30% -2%); }

/* 마노 */
.stone { position: absolute; left: 50%; top: 59%; transform: translate(-50%, -50%); width: min(92vw, calc(54dvh * .75)); aspect-ratio: 3 / 4; }
.stone img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; transition: opacity 1.2s ease, filter 1.2s ease; }
.app.dim .stone img { opacity: .3; filter: grayscale(.5); }

/* 아래: 상태 한 줄 · 남은 시간 선 · 버튼 */
.status { position: absolute; left: 8%; right: 8%; bottom: calc(9% + env(safe-area-inset-bottom)); margin: 0; text-align: center;
  font-size: 13px; font-weight: 500; line-height: 1.6; color: rgba(255,255,255,.65); word-break: keep-all; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
.status.on { opacity: 1; }
.timer { position: absolute; left: 50%; bottom: calc(6.5% + env(safe-area-inset-bottom)); width: 34vw; height: 1px; transform: translateX(-50%);
  background: rgba(255,255,255,.18); opacity: 0; transition: opacity .6s ease; }
.timer.on { opacity: 1; }
.timer i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #fff; }
.again { position: absolute; left: 50%; bottom: calc(5% + env(safe-area-inset-bottom)); transform: translateX(-50%); border: 0; background: none;
  font: 500 15px/1 var(--f); color: rgba(255,255,255,.7); padding: 12px 10px; opacity: 0; pointer-events: none; transition: opacity .5s ease; white-space: nowrap; }
.again.on { opacity: 1; pointer-events: auto; }
.again:active { color: #fff; font-weight: 900; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .guide .ln, .stone img, .status, .again, .timer { transition: none; } }
</style>
</head>
<body>
<div class="app dim" id="app">
  <p class="guide" id="guide" aria-hidden="true"></p>
  <div class="stone" id="stone"><img id="img" alt=""></div>
  <p class="status" id="status"></p>
  <div class="timer" id="timer" aria-hidden="true"><i id="timerBar"></i></div>
  <button class="again" type="button" id="again"></button>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';
  // ── 설정 ─────────────────────────────────────────────
  const WS_URL = '';            // 중계 서버 주소 (예: 'wss://agate-relay.onrender.com'). 비워두면 아래 DEMO로 차례 흐름만 보여줌
  const SEND_HZ = 30;           // 손끝 위치를 보내는 횟수 (초당)
  const TURN_MS = 30000;        // 한 사람이 쓰다듬는 시간
  const DEMO = { ahead: 1, step: 4000 };   // 연결 없을 때: 앞에 몇 명이 있는 것처럼 보여줄지 · 한 명이 빠지는 간격
  const NAMES = {
    'blue-lace':    { no: '#001', ko: '블루 레이스 마노' },
    'fire':         { no: '#002', ko: '파이어 마노' },
    'moss':         { no: '#003', ko: '모스 마노' },
    'crazy-lace':   { no: '#004', ko: '크레이지 레이스 마노' },
    'black-banded': { no: '#005', ko: '블랙 밴디드 마노' }
  };
  // 마노마다 무늬를 따라 쓰다듬는 방법
  const STROKE = {
    'blue-lace':    ['돌 속의 결이 반응할 수 있도록,', '아래에서 위로 살며시 쓰다듬어주세요.'],
    'fire':         ['돌 속의 결이 반응할 수 있도록,', '방울을 따라 둥글게 쓰다듬어주세요.'],
    'moss':         ['돌 속의 결이 반응할 수 있도록,', '가지가 뻗은 쪽으로 쓸어 올려주세요.'],
    'crazy-lace':   ['돌 속의 결이 반응할 수 있도록,', '얽힌 띠를 따라 이리저리 쓰다듬어주세요.'],
    'black-banded': ['돌 속의 결이 반응할 수 있도록,', '바깥에서 가운데로 둥글게 쓰다듬어주세요.']
  };
  const IDS = Object.keys(NAMES);

  // ── 어떤 마노, 어떤 답 (결과 화면 QR: mobile.html#마노id&a=답) ─────
  const raw = decodeURIComponent(location.hash.slice(1));
  const [hid, ha] = raw.split('&a=');
  const id = IDS.includes(hid) ? hid : 'blue-lace';
  const answer = (ha || '').trim().slice(0, 40);
  const session = Math.random().toString(36).slice(2, 10);
  const ORD = ['첫', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
  const nth = n => (ORD[n - 1] || n) + ' 번째';

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = s => document.getElementById(s);
  const app = $('app'), guide = $('guide'), img = $('img'), status = $('status'), timer = $('timer'), bar = $('timerBar'), again = $('again'), live = $('live');
  img.src = 'agate/real/' + id + '.webp';

  // ── 글 ────────────────────────────────────────────────
  let timers = [], shown = '';
  function say(lines) {
    const key = lines.join('|'); if (key === shown) return; shown = key;
    timers.forEach(clearTimeout); timers = [];
    guide.innerHTML = '';
    lines.forEach((t, k) => {
      const s = document.createElement('span'); s.className = 'ln'; s.textContent = t; guide.appendChild(s);
      timers.push(setTimeout(() => s.classList.add('on'), reduced ? 0 : 150 + k * 550));
    });
    live.textContent = lines.join(' ');
  }
  function note(t) { status.textContent = t || ''; status.classList.toggle('on', !!t); }
  function button(t) { again.textContent = t || ''; again.classList.toggle('on', !!t); }

  // ── 상태: wait(연결) → queue(기다림) → turn(쓰다듬기) → done(기록됨) ─────
  let state = '', turnEnd = 0, turnMs = TURN_MS, endT = 0;
  function setQueue(ahead, current) {
    state = 'queue'; app.classList.add('dim'); timer.classList.remove('on'); button('');
    const cur = NAMES[current] || null;
    if (ahead <= 0) { say(['곧 당신의 마노가', '스크린에서 깨어납니다.']); note('손끝을 준비하고 스크린을 바라봐 주세요.'); return; }
    say(cur ? ['지금 스크린에서는 ' + cur.no + ' ' + cur.ko + '의', '결이 천천히 흐르고 있어요.'] : ['지금 스크린에서는 다른 마노의', '결이 천천히 흐르고 있어요.']);
    note(ahead === 1 ? '당신의 마노는 다음 차례에 깨어나요. 스크린을 바라보며 잠시 기다려 주세요.'
                     : '당신의 마노는 ' + nth(ahead + 1) + '로 깨어나요. 스크린을 바라보며 잠시 기다려 주세요.');
  }
  function startTurn(ms) {
    state = 'turn'; app.classList.remove('dim'); button('');
    if (navigator.vibrate) navigator.vibrate([20, 60, 20]);              // 안드로이드: 차례가 왔음을 손으로 알림
    say(STROKE[id]);
    note('');
    turnMs = ms || TURN_MS; turnEnd = performance.now() + turnMs;
    timer.classList.add('on');
    clearTimeout(endT); endT = setTimeout(finish, turnMs);
  }
  function finish() {
    if (state !== 'turn') return;
    state = 'done'; clearTimeout(endT); onUp();
    send({ type: 'end', session, id });
    timer.classList.remove('on');
    say(['당신의 결이', '스크린에 기록되었습니다.']);
    note('');
    button(WS_URL ? '한 번 더 쓰다듬기' : '처음부터 다시 보기');
  }
  again.addEventListener('click', () => {
    if (WS_URL && open) { send({ type: 'join', session, id, answer }); note('다시 줄을 서고 있어요.'); button(''); }
    else demo();
  });

  // ── 웹소켓 (중계 서버 → 터치디자이너) ───────────────────────
  // 받는 메시지: {type:'queue', ahead, current} · {type:'turn', ms} · {type:'end'}
  let ws = null, open = false, retry = 0;
  function send(o) { if (open) try { ws.send(JSON.stringify(o)); } catch (_) {} }
  function connect() {
    if (!WS_URL) { demo(); return; }
    note('스크린과 연결하고 있어요.');
    try { ws = new WebSocket(WS_URL); } catch (_) { return later(); }
    ws.onopen = () => { open = true; retry = 0; send({ type: 'join', session, id, answer }); };
    ws.onmessage = e => {
      let m = null; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.session && m.session !== session) return;
      if (m.type === 'queue') setQueue(m.ahead | 0, m.current);
      if (m.type === 'turn') startTurn(m.ms);
      if (m.type === 'end') finish();
    };
    ws.onclose = () => { open = false; if (state !== 'done') later(); };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }
  function later() { note('스크린과 연결이 잠시 끊겼어요. 다시 연결하고 있어요.'); retry = Math.min(retry + 1, 5); setTimeout(connect, 1000 * retry); }
  addEventListener('pagehide', () => send({ type: 'leave', session, id }));

  // 연결 없을 때: 기다림 → 차례 흐름을 그대로 보여줌
  function demo() {
    let ahead = DEMO.ahead;
    const others = IDS.filter(k => k !== id);
    const tick = () => {
      if (ahead < 0) { startTurn(TURN_MS); return; }
      setQueue(ahead, others[ahead % others.length]);
      ahead--; setTimeout(tick, reduced ? 600 : DEMO.step);
    };
    setTimeout(tick, reduced ? 0 : 700);
  }

  // ── 손끝: 돌 이미지 기준 0~1 좌표로 보냄 ──────────────────────
  const stoneEl = $('stone');
  let down = false, last = null, lastSend = 0, travel = 0, pending = null;
  function local(e) {
    const r = stoneEl.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, t: performance.now(), w: r.width, h: r.height };
  }
  const clamp = v => +Math.min(1, Math.max(0, v)).toFixed(4);
  function onDown(e) {
    if (state !== 'turn') return;
    down = true; last = local(e);
    send({ type: 'touch', phase: 'start', session, id, x: clamp(last.x), y: clamp(last.y), v: 0 });
  }
  function onMove(e) {
    if (!down || state !== 'turn') return;
    const p = local(e), dt = Math.max(1, p.t - last.t);
    const d = Math.hypot((p.x - last.x) * p.w, (p.y - last.y) * p.h);
    const v = Math.min(1, d / dt / 2.5);                                     // 0 (천천히) ~ 1 (빠르게)
    travel += d;
    if (travel > 90 && navigator.vibrate) { navigator.vibrate(6); travel = 0; }   // 안드로이드: 결을 지날 때 짧게
    pending = { type: 'touch', phase: 'move', session, id, x: clamp(p.x), y: clamp(p.y), v: +v.toFixed(3) };
    if (p.t - lastSend > 1000 / SEND_HZ) { send(pending); pending = null; lastSend = p.t; }
    last = p;
  }
  function onUp() {
    if (!down) return;
    down = false; if (pending) { send(pending); pending = null; }
    send({ type: 'touch', phase: 'end', session, id, x: last ? clamp(last.x) : 0, y: last ? clamp(last.y) : 0, v: 0 });
  }
  app.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; if (app.setPointerCapture) try { app.setPointerCapture(e.pointerId); } catch (_) {} onDown(e); });
  app.addEventListener('pointermove', onMove);
  app.addEventListener('pointerup', onUp); app.addEventListener('pointercancel', onUp);
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });   // 화면이 끌려 올라가지 않게

  // 남은 시간 선
  (function loop() {
    if (state === 'turn') bar.style.width = Math.max(0, (turnEnd - performance.now()) / turnMs * 100) + '%';
    requestAnimationFrame(loop);
  })();

  // ── 시작 ───────────────────────────────────────────────
  const go = () => connect();
  if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]).then(go); else go();
  window.AgateMobile = { state: () => ({ state, id, answer, open }), queue: setQueue, turn: startTurn, finish };
})();
</script>
</body>
</html>
